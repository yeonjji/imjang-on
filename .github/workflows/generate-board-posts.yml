name: generate-board-posts

# 자동 스케줄 제거(2026-08-09). 애드센스 3차 거절 사유가 scaled content abuse 계열이라,
# 사람 검수 없는 주간 자동 양산은 재개하지 않는다. UI의 disabled_manually는 클릭 한 번으로
# 풀리므로 cron 자체를 지운다. 필요하면 workflow_dispatch로 1건씩 수동 생성한다.
# 배경: docs/adsense/2026-08-06-rediagnosis-replicated-content.md
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 생성 없이 후보만 출력'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # 짧은 출처(레버리지 ETF 등)에서 mini는 분량 하한(800)을 못 넘김(실측 651 vs gpt-4.1 803).
      # 풀 모델 고정 — topic 워크플로우와 동일 정책. 주 1회·최대 1건이라 비용 영향 미미.
      OPENAI_MODEL: gpt-4.1
      NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
      NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LOG_LEVEL: info
      PRISMA_INGEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm tsx scripts/ingest/posts/runner.ts ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        timeout-minutes: 20
