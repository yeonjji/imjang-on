name: deploy
on:
  # main에서 ci 워크플로가 "완료"되면 트리거되고, 아래 if로 "성공"일 때만 배포.
  # (push: main 직접 트리거는 ci와 병렬로 돌아 게이트가 안 되므로 사용하지 않음)
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# 동시 배포 방지(겹치면 큐잉, 진행 중인 건 취소하지 않음)
concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    # 수동 dispatch거나, ci가 성공으로 끝났을 때만. ci 실패/취소면 스킵.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH push-to-deploy to OCI box
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.OCI_HOST }}
          SSH_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "▶ deploy → $SSH_USER@$HOST (forced-command runs /opt/imjang/deploy/remote-deploy.sh)"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 "$SSH_USER@$HOST" deploy
