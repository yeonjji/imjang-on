name: _diag-siteurl

# 임시 진단용. SITE_URL/토큰 시크릿이 warm 실패(401)의 원인인지 확정 후 삭제한다.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: reveal
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          echo "SITE_URL_b64=$(printf '%s' "$SITE_URL" | base64 -w0 2>/dev/null || printf '%s' "$SITE_URL" | base64 | tr -d '\n')"
          echo "token_len=${#REVALIDATE_TOKEN}"
          echo "token_sha12=$(printf '%s' "$REVALIDATE_TOKEN" | sha256sum | cut -c1-12)"
          code=$(curl -sS -o /tmp/rbody -w '%{http_code}' -X POST "$SITE_URL/api/revalidate" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$REVALIDATE_TOKEN\",\"paths\":[\"/\"]}" || true)
          echo "revalidate_http=$code"
          echo "revalidate_body=$(head -c 300 /tmp/rbody)"
