name: backfill-transactions
on:
  workflow_dispatch:
    inputs:
      api:
        description: 'API (all | apt-trade | apt-rent | offi-trade | offi-rent | rh-trade | rh-rent)'
        default: 'all'
      months:
        description: 'Months to backfill (1–12)'
        default: '12'
      limit:
        description: 'Max targets (sigungu-month) per run; empty = no limit. Use to avoid DB read-only on disk spikes.'
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [apt-trade, apt-rent, offi-trade, offi-rent, rh-trade, rh-rent]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LOG_LEVEL: info
      PRISMA_INGEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - if: ${{ inputs.api == 'all' || inputs.api == matrix.api }}
        run: pnpm tsx scripts/ingest/transactions/runner.ts --api=${{ matrix.api }} --mode=backfill --months=${{ inputs.months }} --limit=${{ inputs.limit }}
        timeout-minutes: 350
