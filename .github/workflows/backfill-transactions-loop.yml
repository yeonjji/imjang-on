name: backfill-transactions-loop
on:
  schedule:
    # 3시간마다 :07. 한 run(6 API 직렬)이 ≈80분이라 매시간이면 run이 겹쳐
    # cancel churn("higher priority waiting request")만 반복된다 → 주기를 run 길이보다 넉넉히.
    - cron: '7 */3 * * *'
  workflow_dispatch:

concurrency:
  group: backfill-transactions-loop
  cancel-in-progress: false

env:
  BACKFILL_FROM: '202301'
  BACKFILL_TO: '202505'
  BACKFILL_LIMIT: '261'  # API job당 ≈1개월치 시군구

jobs:
  backfill:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Micro 인스턴스 디스크 IO baseline(87Mbps) 보호: 동시 write가 baseline을 넘기면
      # 하루 30분 버스트 예산을 태우고 인스턴스 전체가 스로틀된다(사이트 쿼리까지 느려짐).
      # max-parallel:1 + runner 내부 concurrency:1 → write 스트림 딱 1개로 baseline 안 유지.
      # 완주 시간은 늘지만 사이트는 쾌적하고, resume(doneKeys)가 매 run 이어받아 자가복구.
      max-parallel: 1
      matrix:
        api: [apt-trade, apt-rent, offi-trade, offi-rent, rh-trade, rh-rent]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LOG_LEVEL: info
      PRISMA_INGEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - id: check
        run: pnpm tsx scripts/ingest/transactions/backfill-status.ts --api=${{ matrix.api }} --from=${{ env.BACKFILL_FROM }} --to=${{ env.BACKFILL_TO }}
      - if: ${{ steps.check.outputs.pending != '0' }}
        run: pnpm tsx scripts/ingest/transactions/runner.ts --api=${{ matrix.api }} --mode=backfill --from=${{ env.BACKFILL_FROM }} --to=${{ env.BACKFILL_TO }} --limit=${{ env.BACKFILL_LIMIT }}
        # 14h 메가런 방지 상한. throttle 등으로 늘어지면 60분에 끊고, resume가 다음 run에서 이어받는다.
        timeout-minutes: 60

  # 6종 API의 pending 합계가 0이면(=백필 완주) 이 워크플로의 schedule을 스스로 비활성화.
  # 일회성 백필이므로 완주 후 매시간 빈 실행이 Actions 분을 계속 먹는 것을 막는다.
  # 재가동이 필요하면 `gh workflow enable backfill-transactions-loop.yml`.
  finalize:
    needs: backfill
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LOG_LEVEL: info
      PRISMA_INGEST: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # 백필이 대량 업데이트한 Property의 visibility map·통계를 갱신해
      # /list 의 COUNT(인덱스 온리 스캔)가 힙 페치로 느려지지 않게 한다.
      # VACUUM은 트랜잭션 밖에서만 실행 가능 → 세션 연결(DIRECT_URL)로 psql 사용. 실패해도 비치명적.
      - name: VACUUM ANALYZE Property
        continue-on-error: true
        # statement_timeout=0: 디스크 스로틀 시 기본 타임아웃에 걸려 VACUUM이 no-op로
        # 취소되는 것을 막는다(PGOPTIONS로 세션 시작 시 설정).
        run: PGOPTIONS='-c statement_timeout=0' psql "$DIRECT_URL" -c 'VACUUM (ANALYZE) "Property";'
      - id: total
        run: |
          total=0
          for api in apt-trade apt-rent offi-trade offi-rent rh-trade rh-rent; do
            line=$(pnpm tsx scripts/ingest/transactions/backfill-status.ts --api="$api" --from="$BACKFILL_FROM" --to="$BACKFILL_TO")
            echo "$line"
            p=$(echo "$line" | sed -n 's/.*pending=\([0-9]\{1,\}\).*/\1/p')
            total=$((total + p))
          done
          echo "Total pending across all APIs: $total"
          echo "total_pending=$total" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.total.outputs.total_pending == '0' }}
        run: |
          echo "Backfill complete (total pending=0) — disabling scheduled workflow."
          gh workflow disable backfill-transactions-loop.yml
