name: ingest-amenities

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'ev-charger | traditional-market | store | park | school | childcare'
        required: true
        default: 'ev-charger'

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.source)) || fromJson('["ev-charger","traditional-market","store","park","school","childcare"]') }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY }}
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LOG_LEVEL: info
      PRISMA_INGEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm tsx scripts/ingest/amenities/runner.ts --source=${{ matrix.source }}
        timeout-minutes: 180
      - name: Backfill TraditionalMarket.sigunguCode
        if: matrix.source == 'traditional-market'
        run: pnpm tsx scripts/ingest/amenities/market-region-backfill.ts
        timeout-minutes: 30
